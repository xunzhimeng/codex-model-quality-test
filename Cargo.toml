[package]
name = "model-quality-test"
version = "0.3.3"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "f174320e2ac8987578146d4684e69ad196db0286", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "socks"] }
uuid = { version = "1.26.1", features = ["v4"] }
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
